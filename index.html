<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Device Evaluation Commitment Generator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 24px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>HUAWEI Sign Off Sheet Generator</h2>

    <label>Name</label>
    <input id="name" placeholder="e.g., 3lawy Tech">

    <label>Date</label>
    <input id="date" type="date">

    <label>Product Model</label>
    <input id="model" placeholder="e.g., T0029">

    <label>Product Name</label>
    <input id="config" placeholder="e.g., Standard Edition">

    <label>Color</label>
    <input id="color" placeholder="e.g., Ceramic White">

    <label>Serial Number</label>
    <input id="serial" placeholder="e.g., SN123456">

    <label>Quantity</label>
    <input id="quantity" type="number" value="1">

    <button onclick="generate()">Generate Word Document</button>

    <script src="https://unpkg.com/docxtemplater@3.71.0/build/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.2.0/dist/pizzip.js"></script>
    <script src="https://unpkg.com/pizzip@3.2.0/dist/pizzip-utils.js"></script>
    <script src="https://unpkg.com/file-saver@1.3.8/FileSaver.js"></script>

    <script>
        function generate() {
            // 1. Read the 7 user inputs
            const dateValue = document.getElementById('date').value; // "2026-10-29"
            const parts = dateValue.split('-'); // ["2026","10","29"]
            const year  = parts[0] || '';
            const month = parts[1] || '';
            const day   = parts[2] || '';

            const data = {
                name:     document.getElementById('name').value,
                month:    month,
                day:      day,
                year:     year,
                model:    document.getElementById('model').value,
                config:   document.getElementById('config').value,
                color:    document.getElementById('color').value,
                serial:   document.getElementById('serial').value,
                quantity: document.getElementById('quantity').value
            };

            // 2. Load template.docx from the same folder
            PizZipUtils.getBinaryContent('template.docx', function (error, content) {
                if (error) {
                    alert('Could not find template.docx in the same folder as index.html.');
                    throw error;
                }

                const zip = new PizZip(content);
                const doc = new window.docxtemplater(zip, {
                    paragraphLoop: true,
                    linebreaks: true
                });

                // 3. Replace placeholders
                doc.render(data);

                // 4. Download the generated file
                const blob = doc.getZip().generate({
                    type: 'blob',
                    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                });

                const fileName = data.name + '_' + data.config + '.docx';
                saveAs(blob, fileName);
            });
        }
    </script>
</body>
</html>
